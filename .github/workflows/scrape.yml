name: Aggiorna Bollettino Ondate di Calore

on:
  schedule:
    # Esecuzioni programmate (orari UTC):
    # - Alle 09:15 UTC (11:15 italiane) -> subito dopo la pubblicazione ufficiale del bollettino
    # - Alle 14:15 UTC (16:15 italiane) -> esecuzione di controllo pomeridiana
    - cron: '15 9,14 * * *'
  workflow_dispatch: # Consente l'avvio manuale del workflow tramite l'interfaccia web di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      # Richiede i permessi di scrittura sul repository per poter salvare il JSON aggiornato
      contents: write

    steps:
    - name: Checkout del repository
      uses: actions/checkout@v4

    - name: Configura l'ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa le dipendenze
      run: |
        pip install requests

    - name: Esegui lo scraping del bollettino
      run: |
        python scrape_bollettino.py

    - name: Salva e pubblica i dati aggiornati
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add bollettino_ancona.json
        # Esegui il commit solo se il file ha effettivamente subito modifiche
        if ! git diff --cached --quiet; then
          git commit -m "Aggiornamento automatico bollettino ondate di calore"
          git push
        else
          echo "I dati sono già aggiornati. Nessun commit necessario."
        fi
